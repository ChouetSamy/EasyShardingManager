version: '3.8'
services:
  app:
    build: .
    ports: ["8000:8000"]
    volumes: [".:/app"]

  cockroachdb:
    image: cockroachdb/cockroach:latest
    command: start-single-node --insecure
    ports: ["26257:26257", "8080:8080"]

  mongodb:
    image: mongo:7
    ports: ["27017:27017"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true